name: bridge_flutter_sdk
description: "bridge-flutter-sdk — ViewTrade Bridge Flutter SDK (embeddable WebView onboarding/trading shell)."
version: 1.0.1
homepage: https://www.viewtrade.com
repository: https://github.com/viewtrade/bridge-flutter-sdk

environment:
  sdk: ^3.5.0
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  glomopay_sdk: ^2.1.2
  http: ^1.2.2
  path: ^1.9.0
  path_provider: ^2.1.5
  shared_preferences: ^2.3.3
  webview_flutter: ^4.10.0
  webview_flutter_android: ^4.3.0
  webview_flutter_wkwebview: ^3.16.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: false
