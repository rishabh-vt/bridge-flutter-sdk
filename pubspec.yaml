name: bridge_flutter_sdk
description: "bridge-flutter-sdk — ViewTrade Bridge Flutter SDK (token launch → WebView shell)."
version: 2.1.5
homepage: https://www.viewtrade.com
repository: https://github.com/viewtrade/bridge-flutter-sdk

environment:
  sdk: ^3.5.0
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_inappwebview: ^6.1.5
  http: ^1.2.2
  path_provider: ^2.1.5
  # Allow hosts on permission_handler 11.x or 12.x (macm_flutter uses ^12).
  permission_handler: ">=11.3.1 <13.0.0"
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: false
